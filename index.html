<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz Platform</title>

   
</head>

<body>

    <div class="container">

        <h1>Quizrr</h1>
         
      
<!--LOGIN SCREEN -->
           <div id="login-screen">
            <h2>Welcome 👋 Let's Get Started!</h3>
                <br>
            <input type="email" id="email" placeholder="Enter your email"><br>
            <button id="continue" onclick="startScreen()">continue</button>
           </div> 

       
          
 <!-- START SCREEN  -->
        <div id="start-screen" class="hidden">
               <h2>Select Level</h2>
        <button  onclick="startQuiz('Jee mains')">
                Jee mains
        </button>
         <button onclick="startQuiz('Jee Advanced')">
                Jee Advanced    </button>
        </div>


<!-- QUESTION SCREEN -->     
        <div id="question-screen" class="hidden">

            <h2 id="quiz-title"></h2>

            <p id="progress"></p>

            <h3 id="question-text"></h3>

            <div id="options-container"></div>

            <div class="navigation">

                <button id="prev-btn" onclick="previousQuestion()">
                    Previous
                </button>

                <button id="next-btn" onclick="nextQuestion()">
                    Next
                </button>

                <button id="submit-btn" onclick="submitQuiz()">
                    Submit
                </button>

            </div>

        </div>


        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">

            <h2>Quiz Completed!</h2>

            <h3 id="score"></h3>

            <p id="percentage"></p>

            <div id="review-container"></div>

            <button onclick="restartQuiz()">
                Restart Quiz
            </button>

            <button onclick="goHome()">
                Choose Another Quiz
            </button>

        </div>
   <script src="question.js"></script>
    <script src="script.js"></script>
    </div>

   
</body>
</html>
